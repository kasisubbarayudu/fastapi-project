name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Run tests
  test:
    name: Run tests using PyTest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.DB_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.DB_NAME || 'fastapi' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PostgreSQL Client & Create testingdb
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWD || 'postgres' }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD="$PGPASSWORD" psql -h localhost -U "$DB_USER" -c "CREATE DATABASE testingdb;"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Tests
        env:
          DB_HOST: localhost
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_PASSWD: ${{ secrets.DB_PASSWD || 'postgres' }}
          DB_NAME: ${{ secrets.DB_NAME || 'fastapi' }}
          ACCESS_TOKEN_EXPIRY_PERIOD_IN_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRY || '60' }}
          COGNITO_BACKEND: "False"
        run: |
          pytest -s -v

  # Build & Push Docker Image
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata (Tags & Labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/kashi-memories-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy Application to EKS via OIDC
  # Note: Here terraform scripts are already configured to create an identity provider
  # to allow gh actions to trust the tokens supplied to sts and allow it to assume role so it has access to eks.
  # also remember an access entry is needed to allow gh actions to interact with the cluster.
  # eks iam permissions just provides infra perm. to interact with cluster access entry must be added.
  deploy-eks:
    name: Deploy Application to EKS (Helm)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role arn can be taken from the output of terraform apply and then configure in github secrets.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME || 'fastapi-memories-eks' }} \
            --region ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Deploy FastAPI App using Helm
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          helm upgrade --install fastapi-memories-api ./helm/fastapi-memories-api \
            --namespace default \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/kashi-memories-api \
            --set image.tag="sha-${SHORT_SHA}" \
            --set env.cognitoBackend="False" \
            --wait --timeout 5m0s



